allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Sebagian plugin (mis. flutter_pdfview) memaksa Android Gradle Plugin versi
// baru (8.11) yang menuntut Gradle 8.13. Proyek ini memakai Gradle 8.11.1,
// jadi versi plugin disamakan dengan versi proyek agar build tetap jalan.
subprojects { project ->
    project.buildscript.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.android.tools.build" && details.requested.name == "gradle") {
                details.useVersion "8.6.0"
            }
        }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
