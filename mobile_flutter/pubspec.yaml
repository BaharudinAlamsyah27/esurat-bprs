name: esurat_mobile
description: "Aplikasi Mobile Android E-Surat BPRS Sragen."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^4.5.0
  firebase_messaging: ^16.2.0
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Font dibundel lokal (tanpa internet/CDN), lisensi OFL di assets/fonts/OFL.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

